name: Verify package

# The text-level suite: it builds the package and runs every test that reads and
# writes files, which is the check a pull request needs. The three round trips
# that install Next, Payload and Pruvious live in the `Round trips` workflow,
# because they take minutes and a few hundred megabytes.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 22 package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check the npm package contents
        run: npm pack --dry-run --json

      - name: Test the installed npm package
        run: npm run test:package
